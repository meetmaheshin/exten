appId: com.ailancers.desktop-tracker
productName: Ailancers Tracker
# productFilename controls the install directory + binary filename, separate
# from the human-readable productName above. We need this to be space-free
# because Chromium's zygote / sandbox machinery splits on whitespace and
# truncates paths at the first space — leading to:
#   "LaunchProcess: failed to execvp: /opt/Ailancers"
#   "FATAL:zygote_host_impl_linux.cc(201) Check failed"
# on every launch. With this set, the .deb installs to /opt/ailancers-tracker/
# instead of /opt/Ailancers Tracker/ — but window titles, menus, and the
# .desktop entry's Name= still show "Ailancers Tracker" from productName.
productFilename: ailancers-tracker
directories:
  output: out
  buildResources: resources
files:
  - dist/**/*
  - resources/**/*
# Mirror the icon outside app.asar so notification daemons (especially on Linux)
# can read it directly — some can't open files inside an asar archive.
extraResources:
  - from: resources/icon.png
    to: icon.png
win:
  target:
    - target: nsis
      arch: x64
  icon: resources/icon.ico
mac:
  target: [dmg]
  icon: resources/icon.png
  category: public.app-category.productivity
linux:
  # AppImage — universal, single-file, no install needed (works on any distro)
  # deb     — Debian/Ubuntu native package (apt install)
  # tar.gz  — raw extract for users who want to run without packaging
  target:
    - AppImage
    - deb
    - tar.gz
  icon: resources/icon.png
  category: Utility
  synopsis: Ailancers activity tracker (time + screenshots + AI usage)
  description: Tracks active time, takes periodic screenshots, and reports AI assistant usage to the Ailancers dashboard.
  # Force clean filenames — without this, tar.gz/deb pick up the npm package name
  # "@ailancers/desktop" with the "@" and "/" mangled into the filename.
  artifactName: ailancers-tracker-${version}-${arch}.${ext}
  executableName: ailancers-tracker
  maintainer: Ailancers <support@ailancers.com>
  desktop:
    StartupNotify: "true"
    Encoding: "UTF-8"
deb:
  # xdotool/xprintidle are recommended (not required) — without them per-app usage
  # tracking is disabled, but idle time still works via Electron's powerMonitor.
  recommends:
    - xdotool
    - xprintidle
  # Run resources/linux/after-install.sh as root after the package is unpacked,
  # to chmod chrome-sandbox to 4755 (setuid). Without this, every launch dies
  # with "FATAL:setuid_sandbox_host.cc(158)" because Chromium refuses to run
  # without its sandbox helper having the right mode.
  afterInstall: resources/linux/after-install.sh
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ailancers Tracker
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  license: null
  perMachine: false
